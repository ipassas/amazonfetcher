# Render Blueprint. In the Render dashboard: New + -> Blueprint, point it at this
# repo, then set the secret values (RAPIDAPI_KEY, ACCESS_CODE) when prompted.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: amazon-product-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn amazon_finder.web:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PROVIDER
        value: rapidapi
      - key: RAPIDAPI_KEY
        sync: false          # your RapidAPI key (can also be set later in Settings)
      - key: ACCESS_CODE
        sync: false          # dashboard passcode (can also be changed in Settings)
      - key: SECRET_KEY
        generateValue: true  # Render generates a random value to sign sessions
      - key: PYTHON_VERSION
        value: "3.12.4"
    # Search history + UI-set settings live in SQLite. By default they go to
    # ./data (writable, but ephemeral — they reset on each deploy/restart).
    # To keep them, upgrade the plan, uncomment this disk, and set
    # HISTORY_DB=/var/data/history.db as an env var above.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
